plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.romanzajic.notespusher'
    compileSdk 34

    defaultConfig {
        applicationId "com.romanzajic.notespusher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            // Debug builds are auto-signed with Gradle's generated debug
            // keystore -- that's enough to install on your own device via
            // "unknown sources"; no signing setup needed for personal use.
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // No networking library on purpose -- java.net.HttpURLConnection (built
    // into Android) plus org.json (also built in) is enough for one PUT
    // call, and keeping dependencies minimal keeps the CI build simple.
}
